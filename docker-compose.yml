version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mtb-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mtb-cluster
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mtb-cluster.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data:
